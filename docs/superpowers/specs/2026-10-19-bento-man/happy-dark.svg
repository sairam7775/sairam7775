-1 1L-3.5 0L-1 -1Z" fill="#FFC94A"></path></g><g transform="translate(90 26)"><path class="tw tw-late" d="M0 -3.5L1 -1L3.5 0L1 1L0 3.5L-1 1L-3.5 0L-1 -1Z" fill="#FFC94A"></path></g></svg>
