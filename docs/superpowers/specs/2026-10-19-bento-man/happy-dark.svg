<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 96 132" width="240" height="330" aria-hidden="true"><style>body{margin:0}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.hop2{animation:hop2 2.4s cubic-bezier(.65,0,.35,1) infinite}
@keyframes hop2{0%,30%{transform:translate(18px,18px)}40%{transform:translate(32px,8px)}50%,80%{transform:translate(46px,18px)}90%{transform:translate(32px,8px)}100%{transform:translate(18px,18px)}}
.d1,.d2,.d3{animation:dots 1.8s ease-in-out infinite}
.d2{animation-delay:.3s}
.d3{animation-delay:.6s}
@keyframes dots{0%,100%{opacity:.15}30%,60%{opacity:1}}
.bigjump{animation:bigjump 1.6s ease-in-out infinite}
@keyframes bigjump{0%,60%,100%{transform:translateY(0)}24%{transform:translateY(-9px)}42%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.pop2{transform-box:fill-box;transform-origin:center;animation:pop2 1.6s ease-in-out infinite}
@keyframes pop2{0%,30%,50%,100%{transform:scale(1)}38%{transform:scale(1.3)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.6s ease-in-out infinite}
.tw-late{animation-delay:.45s}
@keyframes tw{0%,100%{transform:scale(0);opacity:0}30%,60%{transform:scale(1);opacity:1}}
.wave-l{transform-box:fill-box;transform-origin:100% 100%;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,80%,100%{transform:rotate(0)}13%,43%{transform:rotate(-12deg)}28%,58%{transform:rotate(14deg)}}
.lost-tilt{transform-box:fill-box;transform-origin:50% 100%;animation:losttilt 3.2s ease-in-out infinite}
@keyframes losttilt{0%,8%{transform:rotate(0)}18%,40%{transform:rotate(-4deg)}52%,74%{transform:rotate(4deg)}86%,100%{transform:rotate(0)}}
.lost-look{animation:lostlook 3.2s ease-in-out infinite}
@keyframes lostlook{0%,8%{transform:translate(0,0)}18%,40%{transform:translate(-2.2px,0)}52%,74%{transform:translate(2.2px,0)}86%,100%{transform:translate(0,0)}}
.lost-q{animation:lostq 3.2s ease-out infinite}
@keyframes lostq{0%,10%{transform:translateY(5px);opacity:0}24%,80%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(-2px);opacity:0}}
.scratch-l{transform-box:fill-box;transform-origin:100% 100%;animation:scratch 3.2s ease-in-out infinite}
@keyframes scratch{0%,70%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(5deg)}20%,40%,60%{transform:rotate(-2deg)}}
.hopin{animation:hopin 1.4s cubic-bezier(.4,0,.6,1) infinite}
