name: Docs check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test the checker
        run: node --test tools/docs-check/*.test.mjs
      - name: Check the docs vault
        run: node tools/docs-check/check-docs.mjs .
