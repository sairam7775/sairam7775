name: Bento checks

# Runs on every pull request, not only ones that touch bento/, so the result is
# for the merged code: two changes that each pass alone can still fail together.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bento-checks-${{ github.ref }}
  # Never cancel a run on main: every merged commit keeps its own result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bento:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bento
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bento/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
